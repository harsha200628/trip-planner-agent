<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Trip Planner - Agentic System</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Google Fonts for premium typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Marked.js for parsing Markdown to HTML -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- HTML2PDF.js for exporting styled PDFs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <div id="app-layout">
        <!-- ChatGPT-style Sidebar -->
        <aside class="sidebar">
            <button id="new-chat-btn" class="ghost-btn sidebar-new-btn">+ New Trip Plan</button>
            <div id="chat-history-list" class="chat-list">
                <p class="sidebar-empty">Loading trips...</p>
            </div>
            <button id="clear-history-btn" class="ghost-btn danger-btn sidebar-clear-btn">Clear History</button>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <div class="app-container">
        <header>
            <h1 class="gradient-text">AI Trip Planner</h1>
            <p class="subtitle">Build your dream itinerary with our Agentic Workflow.</p>
        </header>

        <main>
            <form id="trip-form" class="glass-panel">
                <div class="form-group full-width">
                    <label for="user-prompt">Describe Your Dream Trip</label>
                    <textarea id="user-prompt" placeholder="e.g. I want a 5-day solo trip to Tokyo next month, focusing on anime culture and amazing street food, with a medium budget... " required></textarea>
                </div>

                <button type="submit" id="submit-btn" class="primary-btn">Plan My Trip</button>
            </form>

            <div id="agent-status" class="glass-panel hidden">
                <div class="status-header" style="justify-content: center; margin-bottom: 0;">
                    <div class="loader"></div>
                    <p id="status-message" class="pulse-text" style="font-size: 1.2rem; margin: 0;">Thinking...</p>
                </div>
            </div>

            <div id="results-container" class="glass-panel hidden">
                <h2 id="results-header">Trip Plan Chat</h2>
                <div id="itinerary-content" class="chat-feed"></div>
                
                <div class="follow-up-section" id="follow-up-section">
                    <div class="follow-up-input-group">
                        <textarea id="follow-up-prompt" placeholder="Message the planner..."></textarea>
                        <button id="follow-up-btn" class="send-btn" title="Send message">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"></path></svg>
                        </button>
                    </div>
                </div>

                <div class="action-buttons">
                    <button id="download-btn" class="secondary-btn">Download PDF</button>
                    <button id="reset-btn" class="ghost-btn">Start Over</button>
                </div>
            </div>
        </main>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
